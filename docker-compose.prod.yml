version: '3.8'

# Production docker-compose for Grafikarsa Web
# Uses pre-built image from Docker Hub (pushed by CI/CD)

services:
  web:
    image: ${DOCKERHUB_USERNAME:-rafapradana}/grafikarsa-web:${IMAGE_TAG:-latest}
    container_name: grafikarsa-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - grafikarsa-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  grafikarsa-network:
    external: true
